<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGIS Kabupaten Wakatobi</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-title">
    <i class="fa-solid fa-map-location-dot"></i>
    <h1>WebGIS Kabupaten Wakatobi</h1>
  </div>
  <span class="badge-island">
    <i class="fa-solid fa-satellite"></i> Citra Satelit
  </span>
</header>

<aside id="panel">
  <div id="statusData" class="status">Memuat data SHP dan OSM...</div>

  <div class="card search-box">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" placeholder="Cari nama fasilitas atau jalan...">
  </div>

  <!-- ZOOM PULAU -->
  <div class="card filter-card">
    <label for="pulauSel"><b><i class="fa-solid fa-location-crosshairs"></i> Zoom ke pulau:</b></label>
    <select id="pulauSel">
      <option value="ALL">Seluruh Wakatobi</option>
      <option>Wangi-Wangi</option>
      <option>Kaledupa</option>
      <option>Tomia</option>
      <option>Binongko</option>
    </select>
  </div>

  <!-- ZOOM KECAMATAN -->
  <div class="card filter-card">
    <label for="zoomKecamatan">
      <b><i class="fa-solid fa-map"></i> Zoom ke kecamatan:</b>
    </label>
    <select id="zoomKecamatan">
      <option value="">Memuat kecamatan...</option>
    </select>
  </div>

  <!-- FILTER JALAN -->
  <div class="card filter-card">
    <label for="filterJalan">
      <b><i class="fa-solid fa-road"></i> Jenis/kelas jalan:</b>
    </label>
    <select id="filterJalan">
      <option value="ALL">Semua jenis jalan</option>
    </select>
  </div>

  <label><i class="fa-solid fa-filter"></i> <b>Filter fasilitas:</b></label>

  <div class="chips-container">
    <button class="chip active" data-category="ALL">Semua</button>
    <button class="chip" data-category="Pariwisata">
      <i class="fa-solid fa-umbrella-beach"></i> Pariwisata
    </button>
    <button class="chip" data-category="Pendidikan">
      <i class="fa-solid fa-graduation-cap"></i> Pendidikan
    </button>
    <button class="chip" data-category="Kesehatan">
      <i class="fa-solid fa-hospital"></i> Kesehatan
    </button>
    <button class="chip" data-category="Pemerintahan">
      <i class="fa-solid fa-building-columns"></i> Pemerintahan
    </button>
    <button class="chip" data-category="Permukiman">
      <i class="fa-solid fa-house-chimney"></i> Permukiman
    </button>
  </div>

  <hr>

  <h4><i class="fa-solid fa-circle-info"></i> Detail objek</h4>
  <div id="hasil" class="detail-card">
    <div class="empty-state">
      <i class="fa-solid fa-hand-pointer"></i>
      <p>Klik titik atau ruas jalan pada peta.</p>
    </div>
  </div>

  <hr>

  <h4><i class="fa-solid fa-chart-line"></i> Panjang jalan (km)</h4>
  <div id="statistikContainer">
    <div class="empty-state">Menunggu data jalan...</div>
  </div>

  <h4><i class="fa-solid fa-list"></i> Jumlah titik fasilitas</h4>
  <div id="rekap"></div>

  <h4><i class="fa-solid fa-bug"></i> Log pemuatan data</h4>
  <div id="log" aria-live="polite"></div>
</aside>

<main id="map" aria-label="Peta WebGIS Kabupaten Wakatobi"></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<script src="app.js"></script>

</body>
</html>
